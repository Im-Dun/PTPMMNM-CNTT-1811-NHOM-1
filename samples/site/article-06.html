<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Ghi chú học tập</title></head><body><article><h1>Ghi chú học tập</h1><p>Ghi chú thuộc về một phiên bản, vì vậy khi nguồn thay đổi nhận xét cũ vẫn có ngữ cảnh.</p><p>Người xem có thể thêm nhận xét riêng trong thư viện được cấp quyền.</p></article></body></html>
